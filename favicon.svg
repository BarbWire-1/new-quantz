<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="9 5 50 50" id="quantz-icon" pointer-events="all">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2de0d0"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#24324a"/>

  <!-- Q ring (ellipse instead of skewed circle) -->
  <ellipse cx="29" cy="31" rx="16" ry="18" stroke="#ffffff" stroke-width="8" fill="none"/>

  <!-- Q tail -->
  <path d="M32 30 L44 42" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" transform="matrix(1 0 0 1 0 0) translate(2 3) rotate(0) scale(1.08 1.08) skewX(0) skewY(0)"/>

  <!-- Dot accents -->
  <g fill="#2de0d0" opacity="0.9">
    <circle cx="11" cy="52" r="2"/>
    <circle cx="54" cy="10" r="4"/>
  <circle cx="54" cy="18" r="2" data-active="true"/></g>

</svg>